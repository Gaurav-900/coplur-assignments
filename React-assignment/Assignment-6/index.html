<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Basics - Assignment 6</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; width: 350px; }
    </style>
</head>
<body>
    <h1>JavaScript Programming Tasks</h1>

    <div class="box">
        <h3>1. Positive, Negative, or Zero</h3>
        <input type="number" id="num1" placeholder="Enter number">
        <button onclick="checkPositiveNegative()">Check</button>
        <p id="res1"></p>
    </div>

    <div class="box">
        <h3>2. Odd or Even</h3>
        <input type="number" id="num2" placeholder="Enter number">
        <button onclick="checkOddEven()">Check</button>
        <p id="res2"></p>
    </div>

    <div class="box">
        <h3>3. Find Largest of Three Numbers</h3>
        <input type="number" id="a" placeholder="First number"><br><br>
        <input type="number" id="b" placeholder="Second number"><br><br>
        <input type="number" id="c" placeholder="Third number"><br><br>
        <button onclick="findLargest()">Find Largest</button>
        <p id="res3"></p>
    </div>

    <div class="box">
        <h3>4. Prime Number Checker</h3>
        <input type="number" id="num3" placeholder="Enter number">
        <button onclick="checkPrime()">Check Prime</button>
        <p id="res4"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>

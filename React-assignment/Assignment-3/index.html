<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Designed Profile Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="main-container">
        <header id="profile-header">
            <img src="https://via.placeholder.com/150" alt="Profile Picture" className="profile-img" id="user-pic">
            <h1 id="user-name">John Doe</h1>
            <p className="bio-text">Computer Science Student & React Enthusiast</p>
        </header>

        <section className="profile-section" id="skills-section">
            <h2 className="section-title">Skills</h2>
            <ul className="skills-list">
                <li className="skill-item">HTML & CSS</li>
                <li className="skill-item">JavaScript</li>
                <li className="skill-item">React.js</li>
            </ul>
        </section>

        <section className="profile-section" id="contact-section">
            <h2 className="section-title">Contact</h2>
            <p className="contact-info">Email: johndoe@example.com</p>
            <p className="contact-info">Phone: +1234567890</p>
        </section>
    </div>
</body>
</html>
